# Dependency update PRs. Each one runs the full CI (typecheck, lint, tests, build, browser tests,
# signed-in tests and the production audit). Nothing merges automatically: an admin reviews and
# merges every PR. Major versions arrive as their own PRs, never grouped, because some (Next.js
# in particular) have breaking changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR a week for everything that stays within its major version.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        update-types:
          - minor
          - patch

