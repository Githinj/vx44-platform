name: CI

# Runs on every push and pull request. Spec §10 requires the white-label check
# to run in CI. The build needs no secrets: getServerEnv() validates them per
# request, not at build time.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: White-label check (no provider name in src/ or public/)
        run: npm run check:whitelabel

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
