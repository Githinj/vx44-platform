name: CI

# Runs on every pull request (whatever its base branch) and on every push to main.
# Branch pushes used to trigger a second, identical run next to the pull_request
# one, doubling the Actions minutes; a branch with no pull request now runs no CI.
# Spec §10 requires the white-label check to run in CI. The build needs no
# secrets: getServerEnv() validates them per request, not at build time.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: White-label check (no provider name in src/ or public/)
        run: npm run check:whitelabel

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Cloudflare's published test site key: always passes, so the browser tests can submit
          # the lead form. Public by design; not a secret.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: npm run test:e2e

      - name: Keep the test report if browser tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Dependency audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high

  # Signed-in back-office tests (SEC-269): an MFA admin works through the console against a
  # throwaway local Supabase stack, and every page is checked against the strict CSP.
  admin-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0

      - name: Start a local Supabase stack (database, auth, API only)
        run: supabase start -x realtime,studio,edge-runtime,logflare,vector,imgproxy,mailpit,postgres-meta,supavisor

      - name: Build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Signed-in admin tests
        run: npm run test:e2e:admin
        env:
          SUPABASE_BIN: supabase

      - name: Keep the test report if admin tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-admin-results
          path: test-results/admin/
          retention-days: 7
