name: Production smoke test

# Read-only checks of https://www.vx44ai.com (e2e-prod/production.spec.ts). It never submits a
# form, books a time or signs in.
# - Daily: every public page in every language, the security headers and the sign-in page. It
#   leaves out the launch check, so a red run means something broke. A red daily run opens a
#   GitHub issue labelled smoke-failure, or comments on the open one, and the next run that passes
#   closes it (the alert job below, through scripts/alert-issue.sh, as the uptime check does).
# - Run by hand (Actions → Production smoke test → Run workflow): the same, plus the launch check
#   that the /demo lead form and its bot check show. That one fails until the production Turnstile
#   keys are set (action pack §1). A hand run that passes also closes an open issue; one that fails
#   opens nothing, unless "test the alert" is ticked.
on:
  schedule:
    - cron: "17 5 * * *" # 08:17 in Kenya, 00:17 in New York
  workflow_dispatch:
    inputs:
      launch:
        description: "Also check the /demo lead form and bot check (fails until the Turnstile keys are set)"
        type: boolean
        default: true
      test_alert:
        description: "Fail on purpose, to test the smoke-failure issue alert"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test the live site
        # The daily run, or a hand run with the box unticked, leaves out the launch check.
        run: npm run test:prod -- ${{ (github.event_name == 'schedule' || !inputs.launch) && '--grep-invert @launch' || '' }}

      - name: Fail on purpose to test the alert
        if: ${{ !cancelled() && inputs.test_alert }}
        run: |
          echo "::error::Failing on purpose (test the alert is ticked), so the alert job runs"
          exit 1

      - name: Keep the report if it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-results
          # Traces and screenshots, plus the JSON report the alert job reads.
          path: |
            test-results/prod/
            test-results/prod-report.json
          retention-days: 7

  # Its own job, so the job that installs packages and visits the live site never holds a token
  # that can write. GitHub emails the repository's watchers about the new issue or comment.
  alert:
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Get the test report
        # Only a failed run keeps one. None if it broke before the tests; the issue then says so.
        if: ${{ needs.smoke.result != 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: production-smoke-results
          path: smoke-results

      - name: Open, update or close the smoke-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RESULT: ${{ needs.smoke.result }}
          EVENT: ${{ github.event_name }}
          TEST_ALERT: ${{ inputs.test_alert && 'true' || 'false' }}
        run: |
          if [ "$RESULT" = "success" ]; then
            node scripts/smoke-alert.mjs --passed alert.md
            bash scripts/alert-issue.sh resolve smoke-failure alert.md
          elif [ "$EVENT" = "schedule" ] || [ "$TEST_ALERT" = "true" ]; then
            node scripts/smoke-alert.mjs smoke-results/prod-report.json alert.md
            title="Production smoke test failed"
            if [ "$TEST_ALERT" = "true" ]; then title="$title (alert test)"; fi
            bash scripts/alert-issue.sh open smoke-failure "$title" alert.md
          else
            echo "A hand run failed; it opens no issue. See the smoke job's log."
          fi
